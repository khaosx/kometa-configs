################################################################################
## movie-collections.yml — Kometa collection file for the Movies library
## Titles not in the library are skipped unless radarr_add_missing is turned on 
## for a given collection.
################################################################################

templates:

  ##############################################################################
  ## Actor filmography built from TMDb's person data, matched to library.
  ##############################################################################

  actor:
    default:
      limit: 200
    tmdb_discover:
      with_cast: <<tmdb_person_id>>
      sort_by: release_date.desc
      limit: <<limit>>
    sync_mode: sync
    collection_order: release
    sort_title: "!020_<<collection_name>>"
    visible_library: true
    visible_home: false
    visible_shared: true
    schedule: 
     - daily

  ###########################################################################
  ## Collections built from TMDb's collection data, matched to library. 
  ###########################################################################

  tmdb-lists:
    optional:
      - collections
      - lists
      - movies
      - tmdb_summary
      - summary
      - company
    tmdb_collection: <<collections>>
    tmdb_list: <<lists>>
    tmdb_movie: <<movies>>
    tmdb_summary: <<tmdb_summary>>
    summary: <<summary>>
    url_poster: <<poster>>
    sync_mode: sync
    limit: 200
    collection_order: release
    sort_title: +03_<<collection_name>>
    radarr_add_missing: false
    schedule: 
    - daily
  
  ############################################################################
  ## Collections built from Letterboxd list data, matched to library.
  ############################################################################

  letterboxd-lists:
    optional:
      - letterboxd_list
      - summary
      - poster
    letterboxd_list: <<letterboxd_list>>
    summary: <<summary>>
    url_poster: <<poster>>
    sync_mode: sync
    limit: 200
    sort_title: +03_<<collection_name>>
    collection_order: custom
    schedule: 
     - daily

  ###########################################################################
  ## Collections built from a Trakt user list, matched to library.
  ###########################################################################

  trakt-lists:
    optional:
      - trakt_list
      - summary
      - poster
    trakt_list: <<trakt_list>>
    summary: <<summary>>
    url_poster: <<poster>>
    sync_mode: sync
    limit: 200
    sort_title: +03_<<collection_name>>
    collection_order: custom
    schedule:
     - daily

  ###########################################################################
  ## IMDb list - built from IMDb's list data, matched to library.
  ###########################################################################

  imdb-lists:
    url_poster: <<poster>>
    summary: <<summary>>
    sort_title: +03_<<collection_name>>
    radarr_add_missing: false
    sync_mode: sync
    schedule: 
     - daily

collections:

  ###################################################
  ## Actor Filmography Collections
  ###################################################

  Jason Statham:
