################################################################################
# movie-collections.yml — Kometa collection file for the Movies library
################################################################################

templates:

  ##############################################################################
  # Actor filmography - built from TMDb's full credit list for the person, 
  # matched against the library. Titles not in the library are skipped unless 
  # radarr_add_missing is turned on for a given collection.
  ##############################################################################

  actor:
    default:
      limit: 200
    tmdb_discover:
      with_cast: <<tmdb_person_id>>
      sort_by: release_date.desc
      limit: <<limit>>
    sync_mode: sync
    collection_order: release
    minimum_items: 2
    delete_below_minimum: true
    sort_title: "!020_<<collection_name>>"
    visible_library: true
    visible_home: false
    visible_shared: true
    radarr_add_missing: false

  ###########################################################################
  # TMDb collection - built from TMDb's collection data, matched against the
  # library. Titles not in the library are skipped unless radarr_add_missing
  # is turned on for a given collection.
  ###########################################################################
  tmdb-lists:
    optional:
      - collections
      - lists
      - movies
      - tmdb_summary
      - summary
      - company
    tmdb_collection: <<collections>>
    tmdb_list: <<lists>>
    tmdb_movie: <<movies>>
    tmdb_summary: <<tmdb_summary>>
    summary: <<summary>>
    url_poster: <<poster>>
    sync_mode: sync    
    sort_title: +03_<<collection_name>>
    radarr_add_missing: true

  ###########################################################################
  # IMDb list - built from IMDb's list data, matched against the library. 
  # Titles not in the library are skipped unless radarr_add_missing is turned 
  # on for a given collection.
  ###########################################################################
  imdb-lists:
    url_poster: <<poster>>
    summary: <<summary>>
    sort_title: +03_<<collection_name>>
    radarr_add_missing: true
    sync_mode: sync


collections:
  ###################################################
  ## Actor Filmography Collections
  ###################################################
  Jason Statham:
    template:
      name: actor
      tmdb_person_id: 976
    summary: >-
