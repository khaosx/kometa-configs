######################################################
#                    Playlists                       #
######################################################

templates:
  trakt-lists:
    trakt_list: <<list>>
    url_poster: https://<<poster>>
    libraries: Movies,TV
    sync_mode: sync
    delete_playlist: false
  sleepytime:
    sync_mode: sync
    sync_to_users:
    libraries: TV
    url_poster: https://<<poster>>
    plex_search:
      sort_by:  release.asc
      type: episode
      all:
        title.is: <<title>>
        episode_air_date.not: 14       # this field only accepts days so weeks cannot be added directly
        episode_unplayed: false
        episode_last_played.not: 21    # this field only accepts days so weeks cannot be added directly

playlists:

######################################################
#                      MCU                           #
######################################################  
  '(Marvel Universe) Legacy: WWII & The 1940s':
    sync_mode: sync
    sync_to_users:
    libraries: Movies, TV
    url_poster: https://i.scdn.co/image/ab67616d0000b2738bce26dd1c8180f424cbef00
    text: |-
      tmdb:1771                # Captain America: The First Avenger
      tmdb:211387              # Marvel One-Shot: Agent Carter
      tvdb_season:281485_1     # Marvel's Agent Carter - Season 1
      tvdb_season:281485_2     # Marvel's Agent Carter - Season 2

  '(Marvel Universe) Legacy: The Fox X-Men Saga':
    sync_mode: sync
    sync_to_users:
    libraries: Movies
    url_poster: https://i.scdn.co/image/ab67616d0000b2738bce26dd1c8180f424cbef00
    text: |-
      tmdb:49538    # X-Men: First Class
      tmdb:2080     # X-Men Origins: Wolverine
      tmdb:36657    # X-Men
      tmdb:36658    # X2: X-Men United
      tmdb:36668    # X-Men: The Last Stand
      tmdb:76170    # The Wolverine
      tmdb:127585   # X-Men: Days of Future Past
      tmdb:246655   # X-Men: Apocalypse
      tmdb:320288   # Dark Phoenix

######################################################
#                    Smarties                        #
######################################################  

  Sleepytime Archer:
    template: {name: sleepytime, title: Archer (2009), poster: theposterdb.com/api/assets/11645}

  Sleepytime Rick And Morty:
    template: {name: sleepytime, title: Rick and Morty, poster: theposterdb.com/api/assets/24560}

  Animated SleepyTime:
    sync_mode: sync
    sync_to_users:
    libraries: TV
    url_poster: https://i.scdn.co/image/ab67616d0000b2738bce26dd1c8180f424cbef00
    plex_search:
      sort_by: random
      type: episode
      limit: 100
      all:
        any:
          title.is:
            - Archer (2009)
            - Rick And Morty
            - American Dad!
            - Family Guy
        episode_unplayed: false
        episode_air_date.not: 14       # this field only accepts days so weeks cannot be added directly
        episode_last_played.not: 21    # this field only accepts days so weeks cannot be added directly

######################################################
#                     Dynamic                        #
######################################################  

  MCU Chronological:
    template: {name: trakt-lists, list: "https://trakt.tv/users/donxy/lists/marvel-cinematic-universe?sort=rank,asc", poster: imgur.com/cx4CpKo.png}
    summary: Marvel Cinematic Universe In Chronological Order
    sync_to_users: jackienewman
    radarr_add_missing: true
  
  Star Wars Chronological:
    template: {name: trakt-lists, list: "https://trakt.tv/users/khaosx/lists/star-wars-timeline?sort=rank,asc", poster: theposterdb.com/api/assets/4448}
    summary: The Star Wars Universe In Chronological Order
    sync_to_users: jackienewman
    radarr_add_missing: true
